services:

  # ── FastAPI Web Service ──────────────────────────────────────────────────────
  - type: web
    name: grafux-orchestrator
    runtime: python
    plan: standard
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python start.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      # ── Database (auto-linked from managed PostgreSQL below) ───────────────
      - key: DATABASE_URL
        fromDatabase:
          name: grafux-orchestrator-db
          property: internalConnectionString
      # ── Redis (auto-linked from managed Key Value below) ──────────────────
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: grafux-orchestrator-redis
          property: internalConnectionString
      # ── Secrets (set manually in Render dashboard) ─────────────────────────
      - key: INTERNAL_SERVICE_SECRET
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: MCP_SERVICE_URL
        sync: false
      - key: DEVICES_SERVICE_URL
        sync: false
      - key: INTERACTION_SERVICE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: GEMINI_API_KEY
        sync: false
      - key: E2B_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false

  # ── Key Value (Redis-compatible) ──────────────────────────────────────────────
  - type: keyvalue
    name: grafux-orchestrator-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: [] # internal connections only

  # ── AI-Heavy Celery Worker ───────────────────────────────────────────────────
  - type: worker
    name: grafux-orchestrator-worker-ai
    runtime: python
    plan: standard
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A worker.celery_worker worker -Q ai_heavy -c 2 --loglevel=info
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: grafux-orchestrator-db
          property: internalConnectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: grafux-orchestrator-redis
          property: internalConnectionString
      - key: INTERNAL_SERVICE_SECRET
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: MCP_SERVICE_URL
        sync: false
      - key: DEVICES_SERVICE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: E2B_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false

  # ── Research Worker ──────────────────────────────────────────────────────────
  - type: worker
    name: grafux-orchestrator-worker-research
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A worker.celery_worker worker -Q research -c 2 --loglevel=info
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: grafux-orchestrator-db
          property: internalConnectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: grafux-orchestrator-redis
          property: internalConnectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false

  # ── Sandbox Worker ────────────────────────────────────────────────────────────
  - type: worker
    name: grafux-orchestrator-worker-sandbox
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A worker.celery_worker worker -Q sandbox -c 2 --loglevel=info
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: grafux-orchestrator-db
          property: internalConnectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: grafux-orchestrator-redis
          property: internalConnectionString
      - key: E2B_API_KEY
        sync: false

  # ── Celery Beat Scheduler ────────────────────────────────────────────────────
  - type: worker
    name: grafux-orchestrator-beat
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A worker.celery_worker beat --loglevel=info
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: grafux-orchestrator-db
          property: internalConnectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: grafux-orchestrator-redis
          property: internalConnectionString

# ── Managed PostgreSQL ────────────────────────────────────────────────────────
databases:
  - name: grafux-orchestrator-db
    databaseName: grafux_orchestrator
    plan: starter
    region: oregon
