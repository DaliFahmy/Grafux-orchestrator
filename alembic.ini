[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# URL is set at runtime by migrations/env.py from the DATABASE_URL env var.
# Do NOT put a real URL here — it would be used as a silent fallback on servers
# where DATABASE_URL is not configured.
sqlalchemy.url = 

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
